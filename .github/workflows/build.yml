name: Build AMXX Plugin

env:
  PLUGIN_NAME: valorantkillsound

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AMX Mod X compiler 1.10 (Linux)
        run: |
          wget -q https://github.com/alliedmodders/amxmodx/releases/download/1.10.0.5481/amxmodx-1.10.0-git5481-base-linux.tar.gz -O amxmodx.tar.gz
          mkdir -p amxmodx_linux
          tar -xzf amxmodx.tar.gz -C amxmodx_linux
          ls -lh amxmodx_linux/addons/amxmodx/scripting/amxxpc*
          AMXXPC=$(find amxmodx_linux -name "amxxpc" -type f | head -n1)
          AMXXPC_DIR=$(dirname "$AMXXPC")
          echo "AMXXPC=$AMXXPC" >> $GITHUB_ENV
          echo "AMXXPC_DIR=$AMXXPC_DIR" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$AMXXPC_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          ls -la "$AMXXPC" "$AMXXPC_DIR/amxxpc32.so"
          chmod +x "$AMXXPC"

      - name: Compile ${{ env.PLUGIN_NAME }}.sma
        run: |
          mkdir -p addons/amxmodx/scripting/compiled
          echo "Using compiler: $AMXXPC (dir $AMXXPC_DIR)"
          ls -la "$AMXXPC_DIR/amxxpc"*
          ls -la addons/amxmodx/scripting/
          LD_LIBRARY_PATH="$AMXXPC_DIR:$LD_LIBRARY_PATH" "$AMXXPC" addons/amxmodx/scripting/${{ env.PLUGIN_NAME }}.sma -oaddons/amxmodx/scripting/compiled/${{ env.PLUGIN_NAME }}.amxx -iaddons/amxmodx/scripting/include -iamxmodx_linux/addons/amxmodx/scripting/include
          ls -lh addons/amxmodx/scripting/compiled/
          test -f addons/amxmodx/scripting/compiled/${{ env.PLUGIN_NAME }}.amxx || { echo "Compile failed - artifact missing" >&2; exit 1; }

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-linux.amxx
          path: addons/amxmodx/scripting/compiled/${{ env.PLUGIN_NAME }}.amxx
          if-no-files-found: error

  build_windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AMX Mod X compiler 1.10 (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/alliedmodders/amxmodx/releases/download/1.10.0.5481/amxmodx-1.10.0-git5481-base-windows.zip -OutFile amxmodx.zip
          Expand-Archive amxmodx.zip -DestinationPath amxmodx_win -Force
          Get-ChildItem -Recurse -Filter "amxxpc*" -Path amxmodx_win | Format-Table FullName,Length
          $AMXXPC = Get-ChildItem -Recurse -Filter "amxxpc.exe" -Path amxmodx_win | Select-Object -First 1 -ExpandProperty FullName
          $AMXXPC_DIR = Split-Path $AMXXPC
          "AMXXPC=$AMXXPC" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AMXXPC_DIR=$AMXXPC_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $AMXXPC_DIR/amxxpc* | Format-List Name,Length,FullName

      - name: Compile ${{ env.PLUGIN_NAME }}.sma
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path addons/amxmodx/scripting/compiled -Force | Out-Null
          Write-Host "Using compiler: $env:AMXXPC (dir $env:AMXXPC_DIR)"
          Get-ChildItem "$env:AMXXPC_DIR/amxxpc*" | Format-Table Name,Length
          Get-ChildItem addons/amxmodx/scripting/ | Format-Table Name,Length
          & $env:AMXXPC "addons\amxmodx\scripting\${{ env.PLUGIN_NAME }}.sma" "-oaddons\amxmodx\scripting\compiled\${{ env.PLUGIN_NAME }}.amxx" "-iaddons\amxmodx\scripting\include" "-iamxmodx_win\addons\amxmodx\scripting\include"
          Get-ChildItem addons/amxmodx/scripting/compiled/ | Format-Table Name,Length
          if (-not (Test-Path addons/amxmodx/scripting/compiled/${{ env.PLUGIN_NAME }}.amxx)) { throw "Compile failed - artifact missing" }

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows.amxx
          path: addons/amxmodx/scripting/compiled/${{ env.PLUGIN_NAME }}.amxx
          if-no-files-found: error
